name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: escape-the-backrooms

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: escape-the-backrooms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run check

      - name: Audit production pages
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/escape-the-backrooms-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=0
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3100/ > /dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/escape-the-backrooms-next.log
            exit 1
          fi
          PAGE_AUDIT_BASE_URL=http://127.0.0.1:3100 npm run audit:pages
